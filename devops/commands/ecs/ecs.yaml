commands:
  - id: ecs.clusters.list
    name: List ECS Clusters
    category: ECS
    description: List clusters with running/pending task and service counts
    tags: [clusters, containers, fargate]
    execution: { type: aws_sdk, service: ecs, operation: ListClusters }
    risk: read_only

  - id: ecs.service.describe
    name: Describe ECS Service
    category: ECS
    description: Inspect the configuration and deployment status of a service
    tags: [service, deployment, rollout, desired, running, errors]
    execution: { type: aws_sdk, service: ecs, operation: DescribeServices }
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: service, type: resource, resource: ecs_service, required: true }
    risk: read_only
    timeout: 30s

  - id: ecs.services.list
    name: Check Running vs Desired Tasks
    category: ECS
    description: Compare desired, running and pending task counts for every service in a cluster
    tags: [desired, running, pending, capacity, unhealthy, errors, failing]
    execution: { type: aws_sdk, service: ecs, operation: DescribeServices }
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
    risk: read_only

  - id: ecs.tasks.stopped
    name: Inspect Stopped Tasks
    category: ECS
    description: Show recently stopped tasks with stop codes, stopped reasons and container exit codes
    tags: [stopped, crash, failing, errors, exit code, oom, restart, why]
    execution: { type: aws_sdk, service: ecs, operation: DescribeTasks }
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: service, type: resource, resource: ecs_service }
      - { name: status, type: enum, options: [STOPPED, RUNNING], default: STOPPED }
    risk: read_only

  - id: ecs.taskdef.describe
    name: Describe Task Definition
    category: Deployments
    description: Show a task definition revision (image, CPU/memory, env names, log config)
    tags: [task definition, revision, image, version]
    execution: { type: aws_sdk, service: ecs, operation: DescribeTaskDefinition }
    parameters:
      - { name: task_definition, type: resource, resource: ecs_taskdef, required: true, description: 'family:revision or ARN' }
    risk: read_only

  - id: ecs.service.force-deploy
    name: Force New ECS Deployment
    category: Deployments
    description: Start a new deployment of the current task definition (replaces all tasks)
    tags: [redeploy, restart, rollout, deployment]
    execution: { type: aws_sdk, service: ecs, operation: UpdateService }
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: service, type: resource, resource: ecs_service, required: true }
      - { name: force_new_deployment, type: bool, default: 'true' }
    risk: mutating

  - id: ecs.service.scale
    name: Scale ECS Service
    category: ECS
    description: Change the desired task count of a service
    tags: [scale, desired, capacity, tasks, replicas]
    execution: { type: aws_sdk, service: ecs, operation: UpdateService }
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: service, type: resource, resource: ecs_service, required: true }
      - { name: desired_count, type: int, required: true, pattern: '[0-9]{1,4}' }
    risk: mutating

  - id: ecs.service.rollback
    name: Roll Back ECS Service
    category: Deployments
    description: Deploy an earlier task definition revision to a service
    tags: [rollback, revert, deployment, revision, task definition]
    execution: { type: aws_sdk, service: ecs, operation: UpdateService }
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: service, type: resource, resource: ecs_service, required: true }
      - { name: task_definition, type: resource, resource: ecs_taskdef, required: true, description: 'family:revision to deploy' }
    risk: mutating

  - id: ecs.task.stop
    name: Stop ECS Task
    category: ECS
    description: Stop one task; the service scheduler starts a replacement
    tags: [stop, kill, restart, task, replace]
    execution: { type: aws_sdk, service: ecs, operation: StopTask }
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: task, type: resource, resource: ecs_task, required: true }
      - { name: reason, type: string, default: 'Stopped from devops CLI' }
    risk: mutating

  - id: ssm.tunnel.ecs
    name: Port-Forward to ECS Task
    category: ECS
    description: Forward a local port to a port inside a running ECS task (needs ECS Exec enabled)
    tags: [port forward, tunnel, ecs, container, debug, connect]
    execution:
      type: interactive
      program: aws
      args:
        - ssm
        - start-session
        - --target
        - 'ecs:{{cluster}}_{{task}}_{{runtime_id}}'
        - --document-name
        - AWS-StartPortForwardingSession
        - --parameters
        - 'portNumber={{port}},localPortNumber={{local_port}}'
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: task, type: resource, resource: ecs_task, required: true }
      - { name: runtime_id, type: string, required: true, pattern: '[A-Za-z0-9-]+', description: Container runtime ID }
      - { name: port, type: int, required: true }
      - { name: local_port, type: int, default: '18080' }
    risk: mutating

  - id: ecs.exec.shell
    name: ECS Exec Into Container
    category: ECS
    description: Open an interactive shell in a running container (requires ECS Exec enabled)
    tags: [exec, shell, container, connect, debug, terminal]
    execution:
      type: interactive
      program: aws
      args: [ecs, execute-command, --cluster, '{{cluster}}', --task, '{{task}}', --container, '{{container}}', --interactive, --command, '{{shell}}']
    parameters:
      - { name: cluster, type: resource, resource: ecs_cluster, required: true }
      - { name: task, type: resource, resource: ecs_task, required: true }
      - { name: container, type: string, required: true }
      - { name: shell, type: enum, options: [/bin/sh, /bin/bash], default: /bin/sh }
    risk: mutating
